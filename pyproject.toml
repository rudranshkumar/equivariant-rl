[project]
name = "equivariant-rl"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11, <3.12"

[[tool.poetry.packages]]
include = "bulletarm"
from = "BulletArm"

[[tool.poetry.packages]]
include = "bulletarm_baselines"
from = "BulletArm"

[[tool.poetry.packages]]
include = "escnn"
from = "."

[tool.poetry.group.bulletarm.dependencies]
GitPython = "*"
numpy = ">=1.24.0"
pybullet = ">=2.7.1"
"scikit-image" = ">=0.20.0"
scipy = ">=1.8.0"
tqdm = ">=4.31.1"
"opencv-python" = ">=4.10.0"
dill = "*"
"more-itertools" = "*"
"scikit-learn" = "^1.6.0"
e2cnn = "^0.2.3"
matplotlib = "*"
tensorboard = "*"

[tool.poetry.group.cleanrl_utils.dependencies]
torch = "^2.2.0"
gymnasium = "^1.2.0"

[tool.poetry.group.escnn.dependencies]
py3nj = "*"


[tool.poetry.dependencies]
tyro = "^0.9.35"
gymnasium = {extras = ["mujoco"], version = "^1.2.2"}
wandb = "^0.23.1"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
